<div class="vis-container">
  <h2>Array Visualization</h2>
  <div class="controls">
    <div class="input-group">
      <label>Initial Array:</label>
      <input type="text" [(ngModel)]="arrayInput" placeholder="4, 9, 1, 7">
      <button (click)="createArray()" [disabled]="loading">Initialize</button>
    </div>
    <div class="actions">
      <div class="action-item">
        <label>Index:</label>
        <input type="number" [(ngModel)]="updateIndex" placeholder="Idx">
        <label>Value:</label>
        <input type="number" [(ngModel)]="updateValue" placeholder="Val">
        <button (click)="updateArrayValue()" [disabled]="loading">Update</button>
      </div>
      <div class="action-item">
        <label>Index:</label>
        <input type="number" [(ngModel)]="deleteIndex" placeholder="Idx">
        <button (click)="deleteArrayValue()" [disabled]="loading">Delete</button>
      </div>
    </div>
    <div class="actions" style="margin-top: 10px;">
      <div class="action-item">
        <label>Value:</label>
        <input type="number" [(ngModel)]="addValue" placeholder="Val">
        <button (click)="addArrayValue()" [disabled]="loading">Add to End</button>
      </div>
    </div>
  </div>

  <div class="message-area">
    <p *ngIf="serverMessage" class="success">{{ serverMessage }}</p>
    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  </div>

  <div class="array-visual">
    <div class="array-container">
      <div class="array-row">
        <div *ngFor="let value of state; index as i; trackBy: trackByIndex" class="array-cell">
          <div class="index">{{ i }}</div>
          <div class="value">{{ value }}</div>
        </div>
        <div class="empty-msg" *ngIf="state.length === 0">Array is empty.</div>
      </div>
    </div>
  </div>
</div>
