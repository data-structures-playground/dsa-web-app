<div class="vis-container">
  <h2>Stack Visualization</h2>
  <div class="controls">
    <div class="input-group">
      <label>Initial Stack:</label>
      <input type="text" [(ngModel)]="initialInput" placeholder="4, 9, 1, 7">
      <button (click)="initialize()" [disabled]="loading">Initialize</button>
    </div>
    <div class="actions">
      <div class="action-item">
        <label>Value:</label>
        <input type="number" [(ngModel)]="inputValue" placeholder="Val">
        <button (click)="push()" [disabled]="loading">Push</button>
      </div>
      <div class="action-item">
        <button (click)="pop()" [disabled]="loading">Pop</button>
        <button (click)="peek()" [disabled]="loading">Peek</button>
      </div>
    </div>
  </div>

  <div class="message-area">
    <p *ngIf="serverMessage" class="success">{{ serverMessage }}</p>
    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  </div>

  <div class="stack-visual">
    <div class="stack-column">
      <div *ngFor="let item of state.slice().reverse(); let i = index" class="stack-element">
        {{ item }}
      </div>
      <div *ngIf="state.length === 0" class="empty-stack">Stack is Empty</div>
    </div>
  </div>
</div>
